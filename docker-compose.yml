# NOTE: MVP phase uses SQLite (file:./dev.db) — no Docker services required.
# PostgreSQL service is prepared below for production deployment.
# To switch to PostgreSQL:
#   1. Uncomment the postgres service below
#   2. Change prisma/schema.prisma: provider = "postgresql"
#   3. Update .env: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/dts_db?schema=public"
#   4. Run: npx prisma migrate dev

